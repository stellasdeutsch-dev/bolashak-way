<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <title>Bolashak Way</title>
    <script>
      /*
       * Static-host fallback. The app is hash-routed, so a plain path like /stage/testing
       * never exists on the server; this page turns it back into <app root>/#/stage/testing.
       *
       * BASE_SEGMENTS = how many path segments the app is served under:
       *   0 — root of a domain (https://example.kz/)
       *   1 — GitHub Pages project site (https://user.github.io/repo/)  ← current deployment
       * Set it to match your deployment; everything else is derived from it.
       *
       * GitHub Pages serves this one file for every missing path on the site, including
       * the sub-apps published in their own folders, so those are recognised here and get
       * one more segment: /repo/cloud/stage/x → /repo/cloud/#/stage/x.
       */
      var BASE_SEGMENTS = 1
      var SUB_APPS = ['cloud']

      var l = window.location
      var parts = l.pathname.split('/').filter(Boolean)
      if (SUB_APPS.indexOf(parts[BASE_SEGMENTS]) !== -1) BASE_SEGMENTS += 1
      var base = '/' + parts.slice(0, BASE_SEGMENTS).join('/') + (BASE_SEGMENTS ? '/' : '')
      var rest = parts.slice(BASE_SEGMENTS).join('/')
      l.replace(l.origin + base + '#/' + rest + l.search)
    </script>
  </head>
  <body></body>
</html>
