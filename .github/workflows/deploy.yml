# Builds the app and publishes dist/ to the gh-pages branch on every push to main.
#
# Why a branch and not the Pages artifact flow: an artifact deployment replaces the
# whole site, so a second build (the `cloud` branch, published under /cloud/) could
# never coexist with it. Publishing into gh-pages with keep_files lets each branch own
# its own folder: main writes the root and leaves /cloud alone; cloud writes /cloud
# and leaves the root alone.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Both branches push to the same gh-pages branch; serialise them.
concurrency:
  group: gh-pages-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test -- --run
      - run: npm run build
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          # Never wipe /cloud when the root is republished.
          keep_files: true
          commit_message: 'main → / (${{ github.sha }})'
